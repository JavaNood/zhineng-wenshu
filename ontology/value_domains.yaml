  - {name: 门店, entity: 门店, attribute: 门店名称, closed: false, source: 门店.门店名称, note: 取值来自门店实体的门店名称，不在此穷举}
  - {name: 一级类目, entity: 商品, attribute: 一级类目, closed: true, values: [家电, 数码, 美妆, 食品, 服饰, 母婴, 家居]}
