  - {name: 支付方式, entity: 订单, attribute: 支付方式, closed: true, values: [微信支付, 支付宝, 货到付款, 花呗, 京东白条, 银行卡]}
  - {name: 订单状态, entity: 订单, attribute: 订单状态, closed: true, values: [已完成, 已发货, 待发货, 已退款, 已取消]}
  - {name: 月, entity: 日期, attribute: 年月, closed: false, source: 日期.年月, note: 取值来自日期实体的年月，不在此穷举}
  - {name: 季度, entity: 日期, attribute: 季度, closed: true, values: [Q1, Q2, Q3, Q4]}
